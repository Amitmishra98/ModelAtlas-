name: Refresh dates (weekly)

on:
  schedule:
    # Every Monday 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Bump "Last updated" dates
        run: bash scripts/bump-date.sh

      - name: Commit if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "modelatlas-bot[bot]"
            git config user.email "modelatlas-bot@users.noreply.github.com"
            git add -A
            git commit -m "chore: refresh snapshot date to $(date +%F)"
            git push
          else
            echo "No changes — dates already current."
          fi
